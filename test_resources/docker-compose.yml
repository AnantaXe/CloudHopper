services:
  
  postgres_source:
    image: postgres:16
    environment:
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: source_db
    ports:
      - "5435:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  postgres_target:
    image: postgres:15
    environment:
      POSTGRES_USER: target_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: target_db
    ports:
      - "5436:5432" 